publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.4
  firebase_core: ^4.3.0
  firebase_auth: ^6.2.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^22.3.3
  speech_to_text: ^7.5.0
  http: ^1.6.0
  intl: ^0.20.2
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
